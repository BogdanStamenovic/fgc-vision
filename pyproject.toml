[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fgc-vision"
version = "0.1.0"
description = "Detect, track and identify robots in FIRST Global Challenge field livestreams and measure per-robot metrics."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Bogdan Stamenovic" }]
keywords = ["first-global", "robotics", "tracking", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
]
dependencies = ["numpy", "opencv-python-headless", "pillow", "scipy"]

[project.optional-dependencies]
models = ["torch", "torchvision", "ultralytics", "transformers", "lap"]
dev = ["pytest>=8.0,<10", "pytest-cov>=5.0,<7", "ruff>=0.6,<1", "mypy>=1.11,<3"]

[project.scripts]
fgc-vision = "fgc_vision.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fgc_vision"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
